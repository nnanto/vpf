[package]
name = "vpf-http"
version = "0.1.0"
edition = "2024"

[dependencies]
vpf = { path = "../.." }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
futures-util = "0.3"
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
arrow = "60"
parquet = "60"
bytes = "1"
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }
