[package]
name = "vpf"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "crates/vpf-http", "crates/vpf-fuse"]
resolver = "3"

[dependencies]
anyhow = "1.0.104"
arrow = { version = "60", features = ["chrono-tz", "json", "prettyprint"] }
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
parquet = { version = "60", features = ["arrow", "snap", "zstd", "lz4", "flate2", "brotli"] }
rusqlite = { version = "0.41.1", features = ["bundled", "blob"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
criterion = "0.7"
rand = "0.10.3"
tempfile = "3.27.0"

[[bench]]
name = "parquet_io"
harness = false
